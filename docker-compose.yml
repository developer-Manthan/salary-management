services:
  mysql:
    image: mysql:8.0
    container_name: salary-management-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: salary_management
      MYSQL_USER: salary_user
      MYSQL_PASSWORD: salary_pass
    volumes:
      - salary-management-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: salary-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mysql
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    container_name: salary-management-redis
    ports:
      - "6379:6379"
    volumes:
      - salary-management-redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: salary-management-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - salary-management-rabbitmq-data:/var/lib/rabbitmq

volumes:
  salary-management-mysql-data:
  salary-management-redis-data:
  salary-management-rabbitmq-data:
