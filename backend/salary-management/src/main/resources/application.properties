spring.application.name=salary-management
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/salary_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=salary_user
spring.datasource.password=salary_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.task.scheduling.pool.size=2

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000ms

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest