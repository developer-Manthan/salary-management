databaseChangeLog:
  - changeSet:
      id: 004-create-pay-slip-table
      author: manthan
      changes:
        - createTable:
            tableName: pay_slip
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: payroll_cycle_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_prl_payroll_cycle
                    references: payroll_cycle(id)
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_prl_employee
                    references: employee(id)
              - column:
                  name: base_salary
                  type: DECIMAL(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
