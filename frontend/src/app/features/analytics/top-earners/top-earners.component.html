<div class="top-earners-container fade-in">
  
  <div class="header-section">
    <div class="title-with-icon">
      <mat-icon color="primary">leaderboard</mat-icon>
      <h2>Top Earners</h2>
    </div>
    
    <div class="controls">
      <mat-button-toggle-group [(ngModel)]="order" (change)="onControlsChange()">
        <mat-button-toggle value="DESC">Top</mat-button-toggle>
        <mat-button-toggle value="ASC">Bottom</mat-button-toggle>
      </mat-button-toggle-group>

      <mat-form-field appearance="outline" class="limit-selector">
        <mat-label>Show</mat-label>
        <mat-select [(ngModel)]="limit" (selectionChange)="onControlsChange()">
          <mat-option *ngFor="let option of limits" [value]="option">
            {{option}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div class="table-container">
    <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
    
    <div *ngIf="error" class="error-state">
      {{ error }}
    </div>

    <table mat-table [dataSource]="earners" class="mat-elevation-z0" *ngIf="!isLoading && !error">
      
      <!-- Rank Column -->
      <ng-container matColumnDef="rank">
        <th mat-header-cell *matHeaderCellDef> Rank </th>
        <td mat-cell *matCellDef="let element; let i = index"> 
          <span class="rank-badge">{{ i + 1 }}</span>
        </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <!-- Employee Code Column -->
      <ng-container matColumnDef="employeeCode">
        <th mat-header-cell *matHeaderCellDef> Code </th>
        <td mat-cell *matCellDef="let element"> {{element.employeeCode}} </td>
      </ng-container>

      <!-- Department Column -->
      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef> Department </th>
        <td mat-cell *matCellDef="let element">
          <mat-chip-set>
            <mat-chip>{{element.department}}</mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <!-- Country Column -->
      <ng-container matColumnDef="country">
        <th mat-header-cell *matHeaderCellDef> Country </th>
        <td mat-cell *matCellDef="let element"> {{element.country}} </td>
      </ng-container>

      <!-- Current Salary Column -->
      <ng-container matColumnDef="currentSalary">
        <th mat-header-cell *matHeaderCellDef> Salary </th>
        <td mat-cell *matCellDef="let element" class="salary-cell"> 
          {{element.currentSalary | currency:'USD':'symbol':'1.0-0'}} 
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="element-row"></tr>
    </table>
    
    <div *ngIf="earners.length === 0 && !isLoading && !error" class="empty-state">
      No earners found.
    </div>
  </div>
</div>
